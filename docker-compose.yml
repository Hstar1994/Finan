version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: finan-db
    environment:
      POSTGRES_USER: ${DB_USER:-finan}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finan123}
      POSTGRES_DB: ${DB_NAME:-finan_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-finan}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finan-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development  # Use development stage for local dev
    container_name: finan-backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-finan_db}
      DB_USER: ${DB_USER:-finan}
      DB_PASSWORD: ${DB_PASSWORD:-finan123}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      CORS_ORIGIN: http://localhost:8080,http://192.168.8.12:8080,http://127.0.0.1:8080
      FRONTEND_URL: http://192.168.8.12:8080
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
      - node_modules:/app/node_modules
    networks:
      - finan-network
    command: npm run dev

  # Production backend service (use with: docker-compose --profile production up)
  backend-prod:
    profiles:
      - production
    build:
      context: .
      dockerfile: Dockerfile
      target: production  # Use production stage
    container_name: finan-backend-prod
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-finan_db}
      DB_USER: ${DB_USER:-finan}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
    secrets:
      - db_password
      - jwt_secret
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - finan-network
    # Read secrets from files
    entrypoint: >
      sh -c '
        export DB_PASSWORD=$$(cat /run/secrets/db_password) &&
        export JWT_SECRET=$$(cat /run/secrets/jwt_secret) &&
        node src/server.js
      '

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://192.168.8.12:3000/api
    container_name: finan-frontend
    environment:
      - VITE_API_URL=http://192.168.8.12:3000/api
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - finan-network

networks:
  finan-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  node_modules:
    driver: local

# Docker secrets for production (create files: secrets/db_password.txt, secrets/jwt_secret.txt)
secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  node_modules:
    driver: local
